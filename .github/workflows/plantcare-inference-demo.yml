name: PlantCare Inference Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plantcare-inference-demo
  cancel-in-progress: true

jobs:
  serve:
    name: Serve PlantCare AI inference demo
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify model package
        if: ${{ hashFiles('artifacts/plant_disease_mobilenetv3.pth', 'artifacts/class_names.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision
          python scripts/validate_model_artifact.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start inference server
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > inference.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 5
          done

      - name: Start temporary public tunnel
        run: |
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [[ -n "$URL" ]]; then
              echo "PLANTCARE_INFERENCE_BASE_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
              echo "Prediction endpoint: $URL/predict" >> "$GITHUB_STEP_SUMMARY"
              echo "Health endpoint: $URL/health" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 2
          done

      - name: Keep demo server alive
        run: |
          echo "The inference demo remains available while this workflow run is active."
          echo "Use the URL printed in the workflow summary."
          while true; do
            if ! curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              echo "Inference server stopped."
              cat inference.log || true
              exit 1
            fi
            sleep 30
          done