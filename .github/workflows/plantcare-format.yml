name: PlantCare Dart Format

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: plantcare-dart-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply canonical Dart formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Format Dart sources
        working-directory: mobile
        run: dart format lib test

      - name: Commit formatter changes
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "No Dart formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style: apply canonical Dart formatting"
          git push
