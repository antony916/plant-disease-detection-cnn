name: Generate Flutter native shells

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-native-shells:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android and iOS shells
        working-directory: mobile
        run: |
          if [ -d android ] || [ -d ios ]; then
            echo "Native platform directory already exists. Stop instead of regenerating it."
            exit 1
          fi
          flutter create --platforms=android,ios .

      - name: Commit generated native shells
        run: |
          if [ -d mobile/android ] && [ -d mobile/ios ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/android mobile/ios
            if git diff --cached --quiet; then
              echo "No native shell changes to commit."
              exit 0
            fi
            git commit -m "feat: generate Flutter Android and iOS shells"
            git push
          else
            echo "Expected mobile/android and mobile/ios to exist after flutter create."
            exit 1
          fi
