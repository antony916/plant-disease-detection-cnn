name: PlantCare Android Preview

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/plantcare-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-debug-apk:
    if: ${{ hashFiles('mobile/android/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plantcare-ai-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
