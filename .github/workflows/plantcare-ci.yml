name: PlantCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plantcare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  python:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q api src scripts config.py

      - name: Run Python model-registry tests
        run: python -m unittest discover -s api -p "test_*.py"

      - name: Test activation-readiness gates
        run: python scripts/test_plantcare_activation_check.py

      - name: Validate model package when supplied
        shell: bash
        run: |
          if [[ -f artifacts/plant_disease_mobilenetv3.pth && -f artifacts/class_names.txt ]]; then
            python -m pip install --upgrade pip
            python -m pip install torch==2.11.0 torchvision==0.26.0
            python scripts/validate_model_artifact.py
          else
            echo "Model artifact is not committed; activation gate remains external."
          fi
