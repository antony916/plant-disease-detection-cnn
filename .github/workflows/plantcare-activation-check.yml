name: PlantCare Activation Check

on:
  push:
    paths:
      - "api/**"
      - "mobile/**"
      - "scripts/verify_inference_endpoint.py"
      - "render.yaml"
      - ".github/workflows/plantcare-activation-check.yml"
  pull_request:
    paths:
      - "api/**"
      - "mobile/**"
      - "scripts/verify_inference_endpoint.py"
      - "render.yaml"
      - ".github/workflows/plantcare-activation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static activation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate inference Python syntax
        run: python -m compileall -q api scripts/verify_inference_endpoint.py
      - name: Validate Render blueprint
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import pathlib
          import yaml
          data = yaml.safe_load(pathlib.Path("render.yaml").read_text())
          services = data.get("services", [])
          assert len(services) == 1
          service = services[0]
          assert service["name"] == "plantcare-inference"
          assert service["runtime"] == "docker"
          assert service["dockerfilePath"] == "./api/Dockerfile"
          assert service["healthCheckPath"] == "/health"
          assert service["autoDeployTrigger"] == "off"
          print("Render blueprint validation passed.")
          PY
      - name: Validate hosted endpoint verifier
        run: python scripts/verify_inference_endpoint.py --help
  hosted-smoke-check:
    name: Hosted inference smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify deployed inference contract when configured
        env:
          PLANTCARE_INFERENCE_URL: ${{ secrets.PLANTCARE_INFERENCE_URL }}
        run: |
          if [ -z "$PLANTCARE_INFERENCE_URL" ]; then
            echo "[SKIP] PLANTCARE_INFERENCE_URL is not configured yet."
            exit 0
          fi
          python scripts/verify_inference_endpoint.py --base-url "$PLANTCARE_INFERENCE_URL"
