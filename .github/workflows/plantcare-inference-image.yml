name: PlantCare Inference Image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "config.py"
      - "artifacts/**"
      - "docs/model/plantcare_disease_model_manifest.json"
      - ".github/workflows/plantcare-inference-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: plantcare-inference-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/plantcare-inference

jobs:
  build-and-publish:
    name: Build and publish inference image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0

      - name: Run strict model validator
        run: python scripts/validate_model_artifact.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image starts and reports health
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name plantcare-inference -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Inference container health check passed."
              docker logs plantcare-inference
              docker rm -f plantcare-inference
              exit 0
            fi
            sleep 5
          done
          docker logs plantcare-inference
          docker rm -f plantcare-inference
          exit 1
